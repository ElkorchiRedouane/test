name: Milou — vérifier les accès de sauvegarde
on:
  workflow_dispatch:
permissions: {}
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tester PostgreSQL sans afficher de données
        env:
          DATABASE_URL: ${{ secrets.MILOU_DATABASE_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, sys
          from urllib.parse import urlsplit
          dsn = os.environ.get("DATABASE_URL", "").strip()
          if not dsn or "[YOUR-PASSWORD]" in dsn:
              print("::error::URI PostgreSQL absente ou contenant encore le mot de passe à remplacer.")
              sys.exit(1)
          category = "connexion"
          try:
              uri = urlsplit(dsn)
              if uri.scheme not in ("postgres", "postgresql") or not uri.hostname or not uri.username or not uri.password:
                  raise ValueError("uri")
              if not shutil.which("psql"):
                  raise FileNotFoundError()
              result = subprocess.run(["psql", "-X", "--no-password", "--dbname", dsn, "-v", "ON_ERROR_STOP=1", "-Atc", "SELECT 1"], capture_output=True, text=True, timeout=45)
              ok = result.returncode == 0 and result.stdout.strip() == "1"
              diagnostic = result.stderr.lower()
              if any(x in diagnostic for x in ("password authentication failed", "wrong password", "authentication failed", "scram")):
                  category = "authentification"
              elif any(x in diagnostic for x in ("could not translate host", "name or service not known", "no such host")):
                  category = "adresse du serveur"
              elif any(x in diagnostic for x in ("invalid uri", "invalid percent", "extra key/value", "invalid connection option", "missing", "invalid integer")):
                  category = "format de l'URI"
              elif "tenant or user not found" in diagnostic:
                  category = "utilisateur ou serveur du pooler"
              elif "permission denied" in diagnostic:
                  category = "permissions"
          except ValueError:
              ok = False
              category = "format de l'URI"
          except FileNotFoundError:
              ok = False
              category = "client psql absent du runner"
          except subprocess.TimeoutExpired:
              ok = False
              category = "délai de connexion"
          except Exception:
              ok = False
          if not ok:
              print("::error::Échec PostgreSQL : " + category + ". Détails privés masqués.")
              sys.exit(1)
          print("Connexion PostgreSQL chiffrée : réussie.")
          PY
      - name: Tester la clé Storage sans afficher les buckets
        if: always()
        env:
          SERVICE_KEY: ${{ secrets.MILOU_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from urllib.request import Request, urlopen
          token = os.environ.get("SERVICE_KEY", "")
          try:
              if not token:
                  raise ValueError()
              request = Request("https://lgdapxduxmhcixjwzfrq.supabase.co/storage/v1/bucket", headers={"apikey": token, "Authorization": "Bearer " + token})
              with urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if not isinstance(payload, list):
                  raise ValueError()
          except Exception:
              print("::error::Accès Storage refusé ou inaccessible. Détails privés masqués.")
              sys.exit(1)
          print("Accès Storage : réussi.")
          PY
